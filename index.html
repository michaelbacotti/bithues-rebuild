<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bithues — Book Reviews, Articles & Stories</title>
  <meta name="description" content="Book reviews, reading guides, science fiction, fantasy, and original stories — curated for curious readers.">
  <link rel="stylesheet" href="/style.css">
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9312870448453345" crossorigin="anonymous"></script>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <link rel="canonical" href="https://www.bithues.com/index.html">
</head>
<body>

  <div id="site-nav"></div>

  <header class="hero">
    <div class="hero-inner">
      <h1 class="hero-title">Bithues</h1>
      <p class="hero-tagline">Book reviews, reading guides, science fiction, fantasy, and original stories — curated for curious readers.</p>
    </div>
  </header>

  <main class="main">
    <div class="feed" id="feed-grid"></div>
  </main>

  <div id="pagination-controls" style="display:none;justify-content:center;align-items:center;gap:1rem;padding:1.5rem 0;font-family:var(--font-body,system-ui);">
    <button id="prev-btn" onclick="changePage(-1)" style="background:#f5f0e8;color:#3a2f1e;border:1px solid #3a2f1e;padding:6px 18px;border-radius:3px;cursor:pointer;font-size:.9rem;display:none;">← Previous</button>
    <span id="page-num" style="font-size:.9rem;color:#3a2f1e;"></span>
    <button id="next-btn" onclick="changePage(1)" style="background:#f5f0e8;color:#3a2f1e;border:1px solid #3a2f1e;padding:6px 18px;border-radius:3px;cursor:pointer;font-size:.9rem;">Next →</button>
  </div>

  <div style="margin:2rem 0;padding:.75rem;background:var(--surface);border-radius:var(--radius);text-align:center;">
  <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-9312870448453345" data-ad-slot="7590828986" data-ad-format="auto" data-full-width-responsive="true"></ins>
  </div>
  <script>(adsbygoogle = window.adsbygoogle || []).push({});</script>

  <div id="site-footer"></div>

  <script src="/nav.js"></script>
  <script src="/footer.js"></script>
  <script>
  fetch('/search.json')
    .then(r => r.json())
    .then(data => {
      var itemsPerPage = 5;
      var grid = document.getElementById('feed-grid');
      var allCards = [];
      data.forEach(function(item) {
        var cat = item.category || 'Article';
        var pillClass = 'pill-article';
        if (cat === 'Book Review') pillClass = 'pill-book-review';
        else if (cat === 'Short Story') pillClass = 'pill-short-story';
        var card = document.createElement('article');
        card.className = 'card';
        card.innerHTML = '<div class="card-meta-top"><span class="' + pillClass + '">' + cat + '</span></div><h2 class="card-title"><a href="' + item.url + '">' + item.title + '</a></h2><p class="card-excerpt">' + (item.summary || item.excerpt || '') + '</p>';
        card.setAttribute('data-category', cat);
        grid.appendChild(card);
        allCards.push(card);
      });

      var totalPages = Math.ceil(allCards.length / itemsPerPage);
      var currentPage = 1;

      function showPage(page) {
        var start = (page - 1) * itemsPerPage;
        var end = start + itemsPerPage;
        allCards.forEach(function(c, i) {
          c.style.display = (i >= start && i < end) ? '' : 'none';
        });
        document.getElementById('page-num').textContent = page + ' of ' + totalPages;
        document.getElementById('prev-btn').style.display = page <= 1 ? 'none' : '';
        document.getElementById('next-btn').style.display = page >= totalPages ? 'none' : '';
      }

      document.getElementById('pagination-controls').style.display = totalPages > 1 ? 'flex' : 'none';

      window.changePage = function(d) {
        var newPage = currentPage + d;
        if (newPage < 1 || newPage > totalPages) return;
        currentPage = newPage;
        showPage(currentPage);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      showPage(1);  // <-- THIS IS THE MISSING CALL
    });
  </script>

</body>
</html>

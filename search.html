<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Search | Bithues</title>
  <meta name="description" content="Search Bithues book reviews, articles, and stories.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="site-nav"></div>
  <main>
    <div class="search-page">
      <h1>Search</h1>
      <form action="/search.html" method="get" class="search-page-form">
        <input type="text" name="q" class="search-page-input" placeholder="Search..." autofocus>
        <button type="submit" class="search-page-btn">Search</button>
      </form>
      <div class="search-page-results"></div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/nav.js"></script>
  <script src="/footer.js"></script>
  <script src="/search-page.js"></script>
</body>
</html>

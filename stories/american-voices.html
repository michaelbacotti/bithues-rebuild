/* ─── Story Reader Mode ─────────────────────────────── */
.story-hero {
  text-align: center;
  padding: 48px 24px 40px;
}
.story-hero-inner {
  max-width: var(--max-width);
  margin: 0 auto;
}
.story-hero .tag {
  display: inline-block;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 3px 8px;
  border-radius: 3px;
  border: 1px solid #5a7a65;
  color: #5a7a65;
  margin-bottom: 20px;
}
.story-hero h1 {
  font-family: var(--font-serif);
  font-size: clamp(28px, 5vw, 42px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--color-text);
  line-height: 1.2;
  margin-bottom: 14px;
}
.story-hero .byline {
  font-size: 14px;
  color: var(--color-text-light);
  font-style: italic;
}

.story-hero-image {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 0 24px;
}
.story-hero-image img {
  width: 100%;
  max-height: 400px;
  object-fit: cover;
  border-radius: 4px;
  display: block;
}

.story-ad-section {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 24px 24px 0;
  text-align: center;
}
.story-ad-label {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--color-text-light);
  margin-bottom: 8px;
}

/* ─── Reader Container ──────────────────────────────── */
.reader-wrap {
  position: relative;
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 48px 24px 80px;
}

/* Bookmark button */
.reader-bookmark {
  position: absolute;
  top: -8px;
  right: 24px;
  background: none;
  border: none;
  cursor: pointer;
  padding: 8px;
  color: var(--color-text-light);
  border-radius: 4px;
  transition: color 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-sans);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.reader-bookmark:hover { color: var(--color-accent); }
.reader-bookmark:focus-visible {
  outline: 2px solid var(--color-accent);
  outline-offset: 2px;
}
.reader-bookmark .bm-label { white-space: nowrap; }
.reader-bookmark-tooltip {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  background: var(--color-text);
  color: var(--color-surface);
  font-size: 11px;
  font-family: var(--font-sans);
  padding: 5px 10px;
  border-radius: 3px;
  white-space: nowrap;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.2s;
}
.reader-bookmark-tooltip.show { opacity: 1; }

/* Progress bar */
.reader-progress-bar {
  position: absolute;
  top: 0;
  left: 0;
  height: 3px;
  background: var(--color-accent);
  width: 0%;
  border-radius: 0 2px 2px 0;
  transition: width 0.1s linear;
}

/* ─── Story Body ─────────────────────────────────────── */
.reader-body {
  font-family: var(--font-serif);
  font-size: 18px;
  line-height: 1.85;
  color: var(--color-text);
}
.reader-body p {
  margin-bottom: 1.5em;
  font-size: 18px;
  line-height: 1.85;
}
.reader-body p:last-child { margin-bottom: 0; }

/* ─── Share/Back Footer ───────────────────────────────── */
.reader-footer {
  max-width: var(--max-width);
  margin: 0 auto;
  padding: 32px 24px 48px;
  border-top: 1px solid var(--color-border-light);
  display: flex;
  justify-content: center;
}
.reader-back-link {
  font-size: 14px;
  font-weight: 500;
  color: var(--color-accent);
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: color 0.2s;
}
.reader-back-link:hover { color: var(--color-accent-hover); }

@media (max-width: 640px) {
  .reader-body { font-size: 16px; }
  .reader-body p { font-size: 16px; }
  .story-hero h1 { font-size: 28px; }
  .reader-bookmark .bm-label { display: none; }
}

  
/* ─── Story Page Navigation ──────────────────────── */
.story-page-nav {
  display: flex;
  justify-content: center;
  padding: 20px 0;
  border-top: 1px solid var(--color-border-light);
  margin-top: 32px;
}
.story-page-nav-inner {
  display: flex;
  align-items: center;
  gap: 20px;
}
.story-page-indicator {
  font-size: 13px;
  color: var(--color-text-muted);
  font-family: var(--font-sans);
  min-width: 100px;
  text-align: center;
}
.story-page-buttons {
  display: flex;
  gap: 10px;
}
.story-nav-btn {
  background: none;
  border: 1px solid var(--color-border);
  border-radius: 4px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 600;
  color: var(--color-text-muted);
  cursor: pointer;
  transition: all 0.2s;
}
.story-nav-btn:hover:not(:disabled) {
  border-color: var(--color-accent);
  color: var(--color-accent);
}
.story-nav-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}
.story-resume-toast {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--color-text);
  color: var(--color-bg);
  font-size: 13px;
  font-family: var(--font-sans);
  padding: 10px 20px;
  border-radius: 6px;
  opacity: 0;
  transition: opacity 0.3s;
  z-index: 200;
  pointer-events: none;
}
.story-resume-toast.show {
  opacity: 1;
}

@media (max-width: 500px) {
  .story-page-nav-inner { gap: 10px; }
  .story-page-indicator { min-width: 80px; font-size: 12px; }
  .story-nav-btn { padding: 6px 12px; font-size: 12px; }
}

  <script>
// Segmented story reader
(function(){
  var readerBody = document.querySelector('.reader-body');
  if (!readerBody) return;
  var allPs = Array.from(readerBody.querySelectorAll('p'));
  if (allPs.length === 0) return;

  // Dynamic chunk size for even distribution
  var total = allPs.length;
  var targetPages = Math.max(3, Math.min(12, Math.round(total / 5)));
  var chunkSize = Math.max(2, Math.min(8, Math.ceil(total / targetPages)));

  var pages = [];
  for (var i = 0; i < allPs.length; i += chunkSize) {
    pages.push(allPs.slice(i, i + chunkSize));
  }
  var totalPages = pages.length;

  // Move all p tags into segmented divs
  allPs.forEach(function(p){ p.parentNode.removeChild(p); });
  pages.forEach(function(chunk, idx) {
    var div = document.createElement('div');
    div.className = 'story-page-segment';
    div.setAttribute('data-page', idx + 1);
    div.id = 'page-' + (idx + 1);
    if (idx > 0) div.style.display = 'none';
    chunk.forEach(function(p){ div.appendChild(p); });
    readerBody.appendChild(div);
  });

  // Nav bar (centered)
  var nav = document.createElement('div');
  nav.className = 'story-page-nav';
  nav.innerHTML =
    '<div class="story-page-nav-inner">' +
      '<button id="prev-page-btn" class="story-nav-btn" disabled>Previous</button>' +
      '<span class="story-page-indicator">Page <span id="current-page-num">1</span> of <span id="total-pages-num">' + totalPages + '</span></span>' +
      '<button id="next-page-btn" class="story-nav-btn">Next</button>' +
    '</div>';
  readerBody.parentNode.insertBefore(nav, readerBody.nextSibling);

  // Toast
  var toast = document.createElement('div');
  toast.className = 'story-resume-toast';
  toast.id = 'story-resume-toast';
  document.body.appendChild(toast);

  var currentPage = 1;
  var slug = window.location.pathname.split('/').pop().replace('.html','');

  function showPage(n) {
    if (n < 1 || n > totalPages) return;
    document.querySelectorAll('.story-page-segment').forEach(function(el){ el.style.display = 'none'; });
    var target = document.getElementById('page-' + n);
    if (target) target.style.display = 'block';
    var curEl = document.getElementById('current-page-num');
    if (curEl) curEl.textContent = n;
    var prevBtn = document.getElementById('prev-page-btn');
    var nextBtn = document.getElementById('next-page-btn');
    if (prevBtn) prevBtn.disabled = (n === 1);
    if (nextBtn) nextBtn.disabled = (n === totalPages);
    currentPage = n;
    if (history.replaceState) history.replaceState(null, '', '#page-' + n);
    try { localStorage.setItem('bithues-story-' + slug, n); } catch(e){}
    var reader = document.getElementById('reader-container');
    if (reader) reader.scrollIntoView({behavior:'smooth', block:'start'});
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(function(){ toast.classList.remove('show'); }, 3000);
  }

  document.getElementById('next-page-btn').addEventListener('click', function(){ showPage(currentPage + 1); });
  document.getElementById('prev-page-btn').addEventListener('click', function(){ showPage(currentPage - 1); });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); showPage(currentPage + 1); }
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); showPage(currentPage - 1); }
  });

  (function(){
    var savedPage = 1;
    try { savedPage = parseInt(localStorage.getItem('bithues-story-' + slug)) || 1; } catch(e){}
    var hashM = window.location.hash.match(/^#page-(\d+)$/);
    var startPage = hashM ? parseInt(hashM[1]) : savedPage;
    if (startPage > totalPages) startPage = 1;
    if (startPage > 1) { showPage(startPage); showToast('Resume from page ' + startPage); }
    else { showPage(1); }
  })();

  // Per-page scroll progress bar
  var bar = document.getElementById('story-progress-bar');
  var container = document.getElementById('reader-container');
  if (bar && container) {
    function updateProgress() {
      var rect = container.getBoundingClientRect();
      var totalH = container.offsetHeight - window.innerHeight;
      var scrolled = Math.max(0, -rect.top);
      var pct = totalH > 0 ? Math.min(100, (scrolled / totalH) * 100) : 0;
      bar.style.width = pct + '%';
    }
    window.addEventListener('scroll', updateProgress, {passive:true});
    updateProgress();
  }
})();
</script>
